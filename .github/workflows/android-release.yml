name: Android Release Build

on:
  push:
    branches:
      - main
      - release/*
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - production

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Flutter installation
        run: flutter doctor -v

      - name: Run tests
        run: flutter test

      - name: Analyze code
        run: flutter analyze

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  deploy-beta:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_type == 'beta'
    environment: beta
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release

      - name: Upload to Google Play Console (Beta)
        # TODO: Add Google Play upload action
        # Requires service account credentials and setup
        run: |
          echo "Upload to Google Play Console Beta track"
          echo "This step requires Google Play Developer API setup"
          # Use google-play-upload-action or similar

  deploy-production:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_type == 'production'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release

      - name: Upload to Google Play Console (Production)
        # TODO: Add Google Play upload action
        # Requires service account credentials and setup
        run: |
          echo "Upload to Google Play Console Production track"
          echo "This step requires Google Play Developer API setup"
          # Use google-play-upload-action or similar
